- type: reagent
  parent: Blood
  id: SilkBlood
  name: reagent-name-silky-blood
  group: Biological
  desc: reagent-desc-silky-blood
  flavor: horrible
  color: "#a70000"
  recognizable: true
  physicalDesc: reagent-physical-desc-unholy
  slippery: false
  metabolisms:
    Drink:
      # Disgusting!
      effects:
      - !type:SatiateThirst
        factor: 0.5
        conditions:
          - !type:OrganType
            type: Human
            shouldHave: false
      - !type:SatiateHunger
        factor: 0.25
        conditions:
        - !type:OrganType
          type: Vampiric
      - !type:AdjustReagent
        conditions:
        - !type:OrganType
          type: Vampiric
        reagent: Water
        amount: 0.05
      - !type:AdjustReagent
        conditions:
        - !type:OrganType
          type: Vampiric
        reagent: Protein
        amount: 0.05 # See below
      - !type:AdjustReagent
        conditions:
        - !type:OrganType
          type: Vampiric
        reagent: Omnizine
        amount: 0.1
    Food:
      effects:
        - !type:AdjustReagent
          reagent: UncookedAnimalProteins
          amount: 0.05 # 0.25 proteins for 1u of blood - restores 0.75 hunger, adds 0.25 blood per unit
          conditions:
          - !type:OrganType
            type: Vampiric
            shouldHave: false
    Poison:
      effects:
      - !type:HealthChange
        conditions:
        - !type:OrganType
          type: Arachne
          shouldHave: false
        damage:
          types:
            Holy: 4

    Medicine:
      effects:
      - !type:HealthChange
        conditions:
        - !type:OrganType
          type: Arachne
        damage:
          types:
            Holy: -2
